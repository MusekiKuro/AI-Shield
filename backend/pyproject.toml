[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "shield-demo"
version = "0.1.0"
description = "Synthetic transfer protection demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.5",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "websockets==17.4",
  "SQLAlchemy==2.1.8",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "argon2-cffi==25.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/speech/classifier_prompt.txt" = "app/speech/classifier_prompt.txt"
"app/speech/llm_schema.json" = "app/speech/llm_schema.json"
